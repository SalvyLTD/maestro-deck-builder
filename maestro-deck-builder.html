<style>
/* Maestro Deck Builder — visual system from Kit Visual Release '26.
   Slides are authored on a fixed 1920×1080 stage and scaled to fit. */

:root {
  --bg: #100F0E; --bg-2: #141312; --frame: #131211; --card: #181716; --card-2: #1C1A18; --bubble: #24221F;
  --line: #2A2928; --line-2: #3A3938; --conn: #4A443B; --row: #22201E;
  --t1: #FBFAF9; --t2: #CFCCC9; --t3: #A5A29F; --t4: #8B8885; --t5: #75726F;
  --acc: #C3B5A0;
  --nude: #F4F2EE; --l-card: #FFFFFF; --l-t1: #141210; --l-t2: #46423F; --l-lab: #8A8480; --l-eye: #6E6046; --l-line: #EAE6E0; --l-line-2: #C9C4BD;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --f-display: 'Space Grotesk', Helvetica, Arial, sans-serif;
  --f-body: Inter, Helvetica, Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--t1); font-family: var(--f-body); -webkit-font-smoothing: antialiased; }
::selection { background: var(--acc); color: var(--bg); }
a { color: var(--t1); text-decoration: none; }
a:hover { color: var(--t2); }
h1, h2, h3, p, ul, ol, li { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }
img { display: block; }

/* ---------- motion primitives ---------- */
@keyframes m-dot { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
@keyframes m-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes m-flow { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
@keyframes m-up { from { opacity: 0; transform: translate3d(0, 12px, 0); } to { opacity: 1; transform: none; } }
@keyframes m-down { from { opacity: 0; transform: translate3d(0, -16px, 0); } to { opacity: 1; transform: none; } }
@keyframes m-kb { from { transform: scale(1.08); } to { transform: scale(1); } }
@keyframes m-pulse { 0% { box-shadow: 0 0 0 0 rgba(195,181,160,.45); } 100% { box-shadow: 0 0 0 18px rgba(195,181,160,0); } }
@keyframes s-in-f { from { opacity: 0; transform: translate3d(36px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes s-in-b { from { opacity: 0; transform: translate3d(-36px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes s-out { from { opacity: 1; } to { opacity: 0; } }

.rv { opacity: 0; transform: translate3d(0, 14px, 0); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.on { opacity: 1; transform: none; }
.enter-up { animation: m-up .7s var(--ease) both; }
.enter-down { animation: m-down .7s var(--ease) both; }
.caret { display: inline-block; width: .08em; height: 1em; margin-left: .08em; vertical-align: -.12em; background: var(--acc); animation: m-caret 1s steps(1) infinite; }
.live-dot { display: inline-block; flex: 0 0 auto; width: 9px; height: 9px; border-radius: 999px; background: var(--acc); animation: m-dot 2s ease-in-out infinite; }
.sdot { display: inline-block; flex: 0 0 auto; width: 9px; height: 9px; border-radius: 999px; background: var(--acc); }

/* ---------- stage ---------- */
.fit { position: relative; overflow: hidden; }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; overflow: hidden; background: var(--bg); }
.slide { position: absolute; inset: 0; }
.slide.enter.fwd { animation: s-in-f .8s var(--ease) both; }
.slide.enter.back { animation: s-in-b .8s var(--ease) both; }
.static .rv, .static .situation, .static .area, .static .phone-state, .static .dots span, .static .feed-done, .static .synth-svg path { transition: none !important; }
.static .enter-up, .static .enter-down, .static .kb { animation: none !important; }
.slide.leave { animation: s-out .45s var(--ease) both; pointer-events: none; }

/* ---------- type ---------- */
.s-eyebrow { font: 500 22px/1.2 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--acc); }
.s-eyebrow.muted { color: var(--t4); }
.s-display { font-family: var(--f-display); font-weight: 500; font-size: 128px; line-height: .98; letter-spacing: -.05em; text-wrap: balance; }
.s-display-m { font-size: 112px; }
.s-title { font-family: var(--f-display); font-weight: 500; font-size: 92px; line-height: 1.02; letter-spacing: -.046em; text-wrap: balance; }
.s-title-m { font-size: 76px; }
.s-title-s { font-size: 64px; line-height: 1.04; }
.s-sub { font-family: var(--f-body); font-size: 34px; line-height: 1.5; color: var(--t2); text-wrap: pretty; }
.s-body { font-family: var(--f-body); font-size: 28px; line-height: 1.55; color: var(--t3); text-wrap: pretty; }
.s-body strong { color: var(--t1); font-weight: 500; }
.acc, .acc-c { color: var(--acc); }
.mono { font-family: var(--f-mono); }
.mono-s { display: inline-flex; align-items: center; gap: 14px; font: 500 17px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t3); }
.mono-s.acc-c { color: var(--acc); }
.mono-xs { font: 500 15px/1.2 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t3); }
.mono-num { font: 400 19px/1.3 var(--f-mono); color: var(--t3); letter-spacing: .02em; }

/* ---------- atoms ---------- */
.pill { display: inline-flex; align-items: center; gap: 14px; height: 52px; padding: 0 26px 0 20px; border: 1px solid var(--conn); border-radius: 10px; background: rgba(22,21,20,.82); font: 500 18px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t1); white-space: nowrap; }
.pill-dot { width: 9px; height: 9px; border-radius: 999px; background: var(--acc); }
.tag { display: inline-flex; align-items: center; font: 500 16px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); border: 1px solid var(--conn); border-radius: 8px; padding: 8px 12px; white-space: nowrap; }
.sim { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; font: 500 12px/1 var(--f-mono); letter-spacing: .16em; color: var(--t4); }
.conn { position: relative; display: block; flex: 1 1 auto; height: 1px; min-width: 40px; background: var(--conn); }
.conn i { position: absolute; top: -5px; left: 0; width: 11px; height: 11px; margin-left: -5px; border-radius: 999px; background: var(--acc); animation: m-flow 2.6s var(--ease) infinite; }
.dither { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; -webkit-mask-image: radial-gradient(70% 75% at 50% 50%, #000 35%, transparent 100%); mask-image: radial-gradient(70% 75% at 50% 50%, #000 35%, transparent 100%); }

/* ---------- shell ---------- */
.shell { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--t1); font-family: var(--f-display); }
.shell.light { background: var(--nude); color: var(--l-t1);
  --bg: #F4F2EE; --bg-2: #FFFFFF; --card: #FFFFFF; --card-2: #FFFFFF; --bubble: #EAE6E0;
  --line: #E2DDD5; --line-2: #C9C4BD; --conn: #C9C4BD; --row: #EAE6E0;
  --t1: #141210; --t2: #46423F; --t3: #46423F; --t4: #8A8480; --t5: #8A8480; --acc: #6E6046; }
/* dark islands inside light slides keep the dark palette */
.shell.light .mock, .shell.light .cmp-a.dark, .shell.light .topbar.t-dark {
  --bg: #100F0E; --bg-2: #141312; --card: #181716; --card-2: #1C1A18; --bubble: #24221F;
  --line: #2A2928; --line-2: #3A3938; --conn: #4A443B; --row: #22201E;
  --t1: #FBFAF9; --t2: #CFCCC9; --t3: #A5A29F; --t4: #8B8885; --t5: #75726F; --acc: #C3B5A0; color: var(--t1); }
.shell.light .pill, .shell.light .kit-chip { background: #FFFFFF; border-color: var(--line-2); }
.shell.light .topbar.t-light .chip.on { background: #FFFFFF; }
.shell.light .card.hi { box-shadow: 0 30px 60px -40px rgba(20,18,16,.28); }
.shell.light .prompt-bar { background: #FFFFFF; border-color: var(--line); }
.shell.light .client-plate { background: #FFFFFF; }
.shell.light .tool-chip img { filter: invert(1); }
.shell.light .cover-maestro, .shell.light .closing-maestro, .shell.light .synth-logo { filter: invert(1); }
.shell.light .synth-col, .shell.light .agenda-row, .shell.light .cmp-row { border-color: var(--line); }
.shell.light .bridge-rule { background: linear-gradient(to right, rgba(110,96,70,.5), rgba(110,96,70,0)); }
.shell.light .s-eyebrow { color: var(--l-eye); }
.shell.light .s-sub, .shell.light .s-body { color: var(--l-t2); }
.shell.light .s-body strong { color: var(--l-t1); }
.shell.light .acc { color: var(--l-eye); }
.band-top { position: absolute; left: 0; right: 0; top: 0; height: 230px; overflow: hidden; background: linear-gradient(to bottom, #100F0E 0%, #181615 30%, #2C2724 55%, #6E6760 74%, #C4BEB6 89%, #F4F2EE 100%); }
.band-glow { position: absolute; left: 50%; bottom: -46%; width: 150%; height: 130%; transform: translateX(-50%); background: radial-gradient(50% 50% at 50% 50%, rgba(251,250,249,.55) 0%, rgba(251,250,249,0) 68%); filter: blur(34px); }
.topbar { position: absolute; z-index: 3; left: 140px; right: 140px; top: 60px; height: 46px; display: flex; align-items: center; justify-content: space-between; }
.topbar-logo { height: 36px; width: auto; }
.topbar-logo.inv, .inv { filter: invert(1); }
.chips { display: flex; gap: 12px; }
.chip { display: flex; align-items: center; height: 46px; padding: 0 20px; border: 1px solid var(--line); border-radius: 10px; font: 500 16px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t3); }
.chip.on { border-color: var(--line-2); background: rgba(251,250,249,.06); color: var(--t1); }
.body { position: absolute; inset: 0; padding: 200px 140px 110px; }

.foot { position: absolute; left: 140px; right: 140px; bottom: 80px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.foot-meta { display: flex; flex-direction: column; gap: 10px; }
.foot-name { font: 500 30px/1.2 var(--f-display); letter-spacing: -.02em; color: var(--t1); }
.foot-date { font: 500 17px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t4); }
.client-plate { display: flex; align-items: center; justify-content: center; height: 104px; min-width: 200px; max-width: 420px; padding: 22px 32px; border-radius: 16px; background: var(--nude); }
.client-plate img { max-height: 60px; max-width: 356px; width: auto; height: auto; object-fit: contain; }

/* ---------- cover ---------- */
.cover, .closing { position: absolute; inset: 0; }
.cover-top { position: absolute; left: 140px; right: 140px; top: 60px; display: flex; align-items: center; justify-content: space-between; }
.kit-chip { white-space: nowrap; display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(22,21,20,.82); font: 500 16px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; }
.cover-mid { position: absolute; left: 140px; right: 140px; top: 50%; transform: translateY(-54%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 56px; }
.cover-maestro { width: 980px; height: auto; }
.cover-title { max-width: 22ch; font-size: 76px; }
.cover-pills { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

/* ---------- concept ---------- */
.concept-photo { position: absolute; inset: 0; overflow: hidden; }
.concept-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
.kb { animation: m-kb 16s var(--ease) both; }
.concept-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(16,15,14,.97) 0%, rgba(16,15,14,.78) 30%, rgba(16,15,14,.15) 62%, rgba(16,15,14,.35) 100%); }
.concept-logo { position: absolute; left: 140px; top: 60px; }
.concept-text { position: absolute; left: 140px; right: 140px; bottom: 110px; display: flex; flex-direction: column; gap: 32px; }
.concept-title { max-width: 18ch; font-size: 104px; }

/* ---------- agenda ---------- */
.agenda { display: flex; flex-direction: column; gap: 28px; }
.agenda-list { margin-top: auto; display: flex; flex-direction: column; }
.agenda-row { display: grid; grid-template-columns: 120px 520px minmax(0, 1fr); align-items: baseline; gap: 40px; padding: 38px 0; border-top: 1px solid var(--line); }
.agenda-n { font: 500 24px/1 var(--f-mono); letter-spacing: .16em; color: var(--acc); }
.agenda-name { font: 500 64px/1 var(--f-display); letter-spacing: -.045em; }
.agenda-desc { font: 400 30px/1.45 var(--f-body); color: var(--t3); }

/* ---------- product intro ---------- */
.intro { position: absolute; left: 160px; right: 160px; top: 50%; transform: translateY(-46%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 40px; }
.intro-index { font: 500 20px/1 var(--f-mono); letter-spacing: .2em; color: var(--t4); }
.intro-title { max-width: 20ch; font-size: 108px; }
.intro-title .acc { display: block; }
.intro-sub { max-width: 44ch; }
.intro-visual { margin-top: 8px; }
.intro-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.tool-chip { display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 26px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); font: 500 24px/1 var(--f-display); letter-spacing: -.02em; color: var(--t2); }
.tool-chip img { width: 30px; height: 30px; }
.tool-chip.plain { font: 400 22px/1 var(--f-body); letter-spacing: 0; white-space: nowrap; }
.intro-flow { display: flex; align-items: center; gap: 22px; width: 1100px; }
.intro-tags { display: flex; gap: 10px; }
.intro-conn { flex: 1; }
.intro-node { display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 26px; border: 1px solid var(--acc); border-radius: 12px; background: var(--card-2); font: 500 18px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
.intro-out { font: 500 26px/1 var(--f-display); color: var(--t2); letter-spacing: -.02em; }
.intro-claim { max-width: 60ch; font: 500 17px/1.6 var(--f-mono); letter-spacing: .06em; color: var(--t4); }

/* ---------- bridge ---------- */
.bridge { display: flex; flex-direction: column; justify-content: center; gap: 56px; }
.bridge-meta { display: flex; align-items: center; gap: 28px; }
.bridge-idx { font: 500 22px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t3); }
.bridge-title { max-width: 15ch; }
.bridge-rule { height: 1px; width: 100%; background: linear-gradient(to right, rgba(195,181,160,.5), rgba(195,181,160,0)); transform-origin: left; }
.bridge-rule.rv { transform: scaleX(0); }
.bridge-rule.rv.on { transform: scaleX(1); transition-duration: 1.4s; }

/* ---------- founders ---------- */
.founders { display: grid; grid-template-columns: 620px minmax(0, 1fr); gap: 88px; align-items: center; }
.founders-text { display: flex; flex-direction: column; gap: 32px; }
.founders-photo { border: 1px solid var(--line); border-radius: 28px; overflow: hidden; aspect-ratio: 16 / 9; }
.founders-photo img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- synthesis ---------- */
.synth { display: flex; flex-direction: column; gap: 28px; }
.synth-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 48px; }
.synth-col { display: flex; flex-direction: column; gap: 18px; padding: 36px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
.synth-n { font: 500 18px/1 var(--f-mono); letter-spacing: .18em; color: var(--acc); }
.synth-name { font: 500 44px/1.05 var(--f-display); letter-spacing: -.04em; }
.synth-line { font: 400 26px/1.5 var(--f-body); color: var(--t3); text-wrap: pretty; }
.synth-svg { height: 120px; margin: -4px 0; }
.synth-svg svg { width: 100%; height: 100%; overflow: visible; }
.synth-svg path { fill: none; stroke: var(--conn); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 900; stroke-dashoffset: 900; transition: stroke-dashoffset 1.4s var(--ease); }
.synth-svg.on path { stroke-dashoffset: 0; }
.synth-core { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.synth-logo { width: 300px; height: auto; }
.synth-idea { font: 500 52px/1.1 var(--f-display); letter-spacing: -.045em; text-align: center; }
.synth-idea.left { text-align: left; margin-top: 44px; }
.synth-pair { display: grid; grid-template-columns: minmax(0, 1fr) 160px minmax(0, 1fr); align-items: center; margin-top: 56px; }
.synth-pair-conn { display: flex; align-items: center; padding: 0 16px; }
.cmp { display: flex; flex-direction: column; margin-top: 40px; }
.cmp-row { display: grid; grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: baseline; padding: 26px 0; border-top: 1px solid var(--line); }
.cmp-head { border-top: 0; padding-bottom: 18px; }
.cmp-h { font: 500 40px/1 var(--f-display); letter-spacing: -.04em; }
.cmp-label { font: 500 18px/1.3 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t4); }
.cmp-cell { font: 400 28px/1.45 var(--f-body); color: var(--t2); }
.cmp-cell.strong { font: 500 32px/1.25 var(--f-display); letter-spacing: -.03em; color: var(--acc); }

/* ---------- closing ---------- */
.closing-maestro { width: 260px; height: auto; }
.closing-mid { position: absolute; left: 140px; right: 140px; top: 220px; display: flex; flex-direction: column; gap: 40px; }
.closing-title { max-width: 14ch; }
.closing-q { display: flex; flex-direction: column; gap: 22px; margin-top: 16px; }
.closing-ask { font: 500 36px/1.2 var(--f-display); letter-spacing: -.03em; color: var(--t2); }
.closing-q ul { display: flex; flex-direction: column; gap: 14px; }
.closing-q li { display: flex; align-items: center; gap: 20px; font: 400 29px/1.4 var(--f-body); color: var(--t3); }
.closing-q li .tag { min-width: 84px; justify-content: center; }

/* ---------- mockups ---------- */
.mock { border: 1px solid var(--line); border-radius: 28px; overflow: hidden; background: var(--frame); display: flex; flex-direction: column; }
.mock-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 34px; border-bottom: 1px solid var(--line); }

.card { display: flex; flex-direction: column; gap: 18px; padding: 34px; border-radius: 24px; border: 1px solid var(--line); background: var(--card); }
.card.hi { border-color: var(--acc); background: var(--card-2); box-shadow: 0 40px 80px -48px rgba(0,0,0,.9); }
.card-eye { font: 500 16px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t4); }
.card-title { font: 500 38px/1.15 var(--f-display); letter-spacing: -.03em; color: var(--t1); text-wrap: balance; }
.card-body { font: 400 24px/1.5 var(--f-body); color: var(--t3); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.flow-gap { display: flex; align-items: center; }
.scope-chips { display: flex; flex-wrap: wrap; gap: 10px; }
.scope { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; font: 400 21px/1 var(--f-body); color: var(--t2); }

/* mcp what */
.what { display: flex; flex-direction: column; justify-content: center; gap: 26px; padding-top: 170px; }
.what-def { max-width: 58ch; }
.what-flow { margin-top: 56px; display: grid; grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr) 90px minmax(0, 1fr); align-items: stretch; }
.what-flow .flow-gap { padding: 0 6px; }

/* demo layouts */
.demo-grid { display: grid; grid-template-columns: 600px minmax(0, 1fr); gap: 88px; align-items: center; }
.demo-side { display: flex; flex-direction: column; gap: 30px; }
.steps { display: flex; flex-direction: column; margin-top: 18px; }
.step { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 22px 0; border-top: 1px solid var(--line); }
.step.rv.on { opacity: .45; transition: opacity .6s var(--ease), transform .9s var(--ease); }
.step.rv.on.done { opacity: .7; }
.step.rv.on.active { opacity: 1; }
.step-n { font: 500 18px/1.6 var(--f-mono); color: var(--acc); letter-spacing: .1em; }
.step-txt { display: flex; flex-direction: column; gap: 6px; }
.step-name { font: 500 32px/1.15 var(--f-display); letter-spacing: -.03em; }
.step-desc { font: 400 21px/1.45 var(--f-body); color: var(--t3); }

.chat { height: 740px; }
.chat-body { flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 40px 56px 20px; overflow: hidden; }
.chat-body.center { justify-content: center; align-items: center; gap: 28px; }
.bubble { align-self: flex-end; max-width: 80%; padding: 18px 24px; border-radius: 20px 20px 6px 20px; background: var(--bubble); font: 400 26px/1.45 var(--f-body); color: var(--t1); }
.status { display: flex; align-items: center; gap: 14px; font: 400 19px/1.4 var(--f-mono); letter-spacing: .02em; color: var(--t5); }
.answer { display: flex; flex-direction: column; gap: 12px; max-width: 94%; margin-top: 6px; }
.answer p { font: 400 33px/1.45 var(--f-display); letter-spacing: -.01em; color: var(--t1); text-wrap: pretty; }
.chat-input { display: flex; align-items: center; gap: 16px; min-height: 80px; margin: 0 56px 34px; padding: 12px 12px 12px 26px; border: 1px solid #2F2D2A; border-radius: 16px; background: #1A1917; }
.chat-input > span:first-child { flex: 1; min-width: 0; font: 400 24px/1.4 var(--f-body); }
.chat-input .ph { color: var(--t5); }
.chat-input .typed { color: var(--t1); }
.send { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 12px; background: var(--acc); font: 500 24px/1 var(--f-mono); color: var(--bg); transition: transform .2s var(--ease), filter .2s; }
.send.press { transform: scale(.92); filter: brightness(1.15); }
.send.big { width: 72px; height: 72px; font-size: 30px; }

/* light context */
.shell.light:not(:has(.band-top)) .ctx { padding-top: 200px; }
.ctx { display: grid; grid-template-columns: 640px minmax(0, 1fr); gap: 96px; align-items: center; padding-top: 250px; }
.ctx.col { display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 0; padding-top: 230px; }
.ctx-side { display: flex; flex-direction: column; gap: 30px; }
.ctx-head { display: flex; flex-direction: column; gap: 26px; }
.l-label { font: 500 16px/1.2 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--l-lab); }
.cmp-card { display: flex; flex-direction: column; border-radius: 26px; background: var(--l-card); overflow: hidden; }
.cmp-q { padding: 44px 48px; }
.cmp-q .l-label { margin-bottom: 18px; }
.cmp-ask { font: 500 44px/1.2 var(--f-display); letter-spacing: -.036em; color: var(--l-t1); }
.cmp-a { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 28px; align-items: baseline; padding: 34px 48px; border-top: 1px solid var(--l-line); }
.cmp-a.dark { background: var(--l-t1); border-top: 0; padding: 42px 48px; }
.cmp-common { font: 400 26px/1.55 var(--f-body); color: var(--l-lab); }
.cmp-salvy { font: 400 29px/1.5 var(--f-body); color: var(--t1); }

/* prompts */
.prompts { display: flex; flex-direction: column; gap: 30px; }
.prompt-bar { display: flex; align-items: center; gap: 20px; margin-top: 30px; min-height: 120px; padding: 20px 24px 20px 44px; border: 1px solid #2F2D2A; border-radius: 22px; background: #1A1917; }
.prompt-text { flex: 1; font: 400 44px/1.3 var(--f-display); letter-spacing: -.02em; color: var(--t1); }
.prompt-list { display: flex; gap: 14px; flex-wrap: wrap; }
.prompt-item { display: inline-flex; align-items: center; height: 60px; padding: 0 26px; border: 1px solid var(--line); border-radius: 999px; font: 400 23px/1 var(--f-body); color: var(--t3); }
.prompt-item.active { border-color: var(--acc); color: var(--t1); background: rgba(195,181,160,.06); }
.prompt-scope { margin-top: auto; display: flex; align-items: center; gap: 28px; padding-top: 30px; border-top: 1px solid var(--line); }

/* safety */
.points { display: flex; flex-direction: column; gap: 22px; margin-top: 12px; }
.points li { display: flex; align-items: baseline; gap: 18px; font: 400 27px/1.45 var(--f-body); color: var(--t2); }
.pdot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 999px; background: var(--acc); transform: translateY(-4px); }
.confirm { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; width: 100%; max-width: 760px; padding: 40px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
.confirm-q { font: 500 44px/1.15 var(--f-display); letter-spacing: -.035em; }
.cta { white-space: nowrap; display: inline-flex; align-items: center; gap: 16px; height: 70px; padding: 0 28px; border: 1px solid var(--acc); border-radius: 10px; font: 500 18px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t1); transition: background .5s var(--ease), color .5s var(--ease); }
.cta.hover { background: rgba(195,181,160,.14); }
.cta.done { background: var(--acc); color: var(--bg); }
.audit { display: flex; flex-direction: column; width: 100%; max-width: 760px; padding: 26px 40px; border: 1px dashed var(--conn); border-radius: 22px; }
.audit .mono-xs { margin-bottom: 8px; color: var(--acc); }
.audit-row { display: flex; justify-content: space-between; gap: 24px; padding: 12px 0; border-top: 1px solid var(--row); font: 400 22px/1.4 var(--f-body); color: var(--t3); }
.audit-row span:last-child { color: var(--t1); }

/* mdm connection */
.chain { margin-bottom: 0; display: grid; grid-template-columns: minmax(0, 1fr) 140px minmax(0, 1fr) 140px minmax(0, 1fr); align-items: center; margin-top: 90px; }
.chain-conn { display: flex; align-items: center; padding: 0 12px; }
.chain-conn .conn { background: var(--l-line-2); }
.chain-node { display: flex; flex-direction: column; gap: 16px; padding: 44px; border-radius: 24px; background: var(--l-card); min-height: 270px; }
.chain-v { font: 500 48px/1.15 var(--f-display); letter-spacing: -.035em; color: var(--l-t1); }
.chain-v.mono { font: 400 34px/1.2 var(--f-mono); letter-spacing: .02em; }
.chain-x { font: 400 22px/1.4 var(--f-body); color: var(--l-t2); }
.ctx-line { margin-top: 70px; font: 400 40px/1.3 var(--f-display); letter-spacing: -.035em; color: var(--t2); }
.ctx-line strong, .ctx-line .acc { font-weight: 500; color: var(--t1); }
.s-body .acc { color: var(--t1); font-weight: 500; }

/* mdm demo */
.mdm { display: flex; flex-direction: column; gap: 22px; padding-top: 180px; }
.mdm-mock { margin-top: 18px; flex: 1; }
.mdm-grid { flex: 1; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 80px; align-items: center; padding: 28px 64px; }
.phone { width: 270px; height: 520px; margin: 0 auto; padding: 12px; border: 1px solid #3A3733; border-radius: 46px; background: #0C0B0A; }
.phone-screen { position: relative; height: 100%; border-radius: 35px; background: #1A1917; overflow: hidden; display: flex; flex-direction: column; }
.phone-status { display: flex; justify-content: space-between; padding: 20px 26px 0; font: 400 13px/1 var(--f-mono); color: var(--t3); }
.phone-state { position: absolute; inset: 60px 22px 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; transition: opacity .7s var(--ease), transform .7s var(--ease); }
.phone-state.hide { opacity: 0; transform: scale(.96); }
.phone-apps { display: grid; grid-template-columns: repeat(4, 40px); gap: 20px 14px; }
.phone-apps span { width: 40px; height: 40px; border-radius: 11px; background: var(--bubble); }
.lock-ring { width: 70px; height: 70px; border: 1px solid var(--acc); border-radius: 999px; background: rgba(195,181,160,.08); }
.lock-title { font: 500 26px/1.2 var(--f-display); letter-spacing: -.02em; }
.lock-msg { font: 400 16px/1.45 var(--f-body); color: var(--t3); }
.phone-foot { margin-top: auto; padding: 0 20px 24px; text-align: center; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t5); }
.mdm-panel { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.mdm-user { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.mdm-name { font: 500 34px/1.2 var(--f-display); letter-spacing: -.02em; margin-bottom: 8px; }
.situations { display: flex; flex-direction: column; gap: 10px; }
.theme-opt-swatch { display: flex; gap: 0; height: 28px; width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.theme-opt-swatch i { flex: 1; }
.situation { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; padding: 0 24px; border: 1px solid var(--bubble); border-radius: 14px; font: 400 23px/1.3 var(--f-body); color: var(--t2); transition: border-color .6s var(--ease), background .6s var(--ease), color .6s, opacity .9s var(--ease), transform .9s var(--ease); }
.situation.active { border-color: var(--acc); background: rgba(195,181,160,.06); color: var(--t1); }
.sit-x { margin-left: 14px; font: 400 15px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--t5); }

/* api */
.hire { display: flex; flex-direction: column; justify-content: center; gap: 28px; padding-top: 170px; }
.hire-flow { margin-top: 72px; display: grid; grid-template-columns: minmax(0, 1fr) 120px auto 120px minmax(0, 1fr); align-items: center; }
.hire-flow .flow-gap { padding: 0 10px; }
.hire-flow .card { min-height: 280px; }
.hub { display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 28px; border: 1px solid var(--acc); border-radius: 14px; background: var(--card-2); font: 500 19px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
.done-chip { display: inline-flex; align-items: center; gap: 10px; font: 500 15px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); }

.areas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.area { display: flex; align-items: center; height: 76px; padding: 0 26px; border: 1px solid var(--line); border-radius: 14px; font: 500 28px/1 var(--f-display); letter-spacing: -.02em; color: var(--t4); transition: color .6s, border-color .6s, background .6s, opacity .9s var(--ease), transform .9s var(--ease); }
.area.lit { color: var(--t1); border-color: var(--conn); background: var(--card); }
.area.pulse { border-color: var(--acc); animation: m-pulse 1.4s var(--ease) 1; }
.feed { height: 740px; }
.feed-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.feed-row { display: grid; grid-template-columns: 220px minmax(0, 1fr) 120px; align-items: center; gap: 24px; padding: 28px 34px; border-bottom: 1px solid var(--row); }
.feed-when { display: flex; align-items: center; gap: 16px; }
.feed-what { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.feed-ev { font: 400 21px/1.45 var(--f-body); color: var(--t3); }
.feed-act { font: 400 27px/1.3 var(--f-display); letter-spacing: -.01em; color: var(--t1); }
.feed-done { display: inline-flex; align-items: center; justify-content: flex-end; gap: 10px; font: 500 15px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--acc); opacity: 0; transition: opacity .5s var(--ease); }
.feed-done.on { opacity: 1; }

.grid-card { display: flex; flex-direction: column; gap: 30px; padding: 48px; border-radius: 26px; background: var(--l-card); }
.dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 14px; }
.dots span { aspect-ratio: 1; border-radius: 999px; background: var(--l-line); transition: background .5s var(--ease), transform .5s var(--ease); }
.dots span.on { background: var(--l-t1); transform: scale(1.12); }
.grid-legend { display: flex; align-items: center; gap: 36px; font: 400 22px/1 var(--f-body); color: var(--l-t2); }
.grid-legend span { display: inline-flex; align-items: center; gap: 12px; }
.grid-legend .l-label { margin-left: auto; }
.grid-legend i { width: 16px; height: 16px; border-radius: 999px; }
.lg-a { background: var(--l-line); }
.lg-b { background: var(--l-t1); }

/* ======================================================================
   PRESENTER (real px, not scaled)
   ====================================================================== */
.present { position: fixed; inset: 0; display: flex; background: #0A0908; }
.present.idle, .present.idle * { cursor: none !important; }
.present-main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
.present-fit { flex: 1; }
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(251,250,249,.06); z-index: 5; }
.progress span { display: block; height: 100%; background: var(--acc); transition: width .6s var(--ease); }
.controls { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 6; display: flex; flex-wrap: nowrap; justify-content: center; max-width: calc(100% - 24px); width: max-content; align-items: center; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: rgba(16,15,14,.92); transition: opacity .5s var(--ease), transform .5s var(--ease); }
.present.idle .controls { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }
.cbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; min-width: 36px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t2); cursor: pointer; white-space: nowrap; }
.cbtn:hover { background: rgba(251,250,249,.06); color: var(--t1); }
.cbtn:focus-visible { outline: none; border-color: var(--acc); }
.cbtn.on { color: var(--acc); }
.cbtn:disabled { opacity: .3; cursor: default; }
@container (max-width: 1100px) { .csection { display: none; } .cbtn { padding: 0 9px; } }
@container (max-width: 760px) { .cbtn.opt { display: none; } }
@container (max-width: 560px) { .cbtn.fs-btn { display: none; } .csep { display: none; } }
.cbtn .arrow { font-size: 15px; letter-spacing: 0; }
.ccount { min-width: 92px; text-align: center; font: 500 12px/1 var(--f-mono); letter-spacing: .12em; color: var(--t1); }
.csep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.csection { flex: 0 1 auto; min-width: 0; max-width: 180px; overflow: hidden; text-overflow: ellipsis; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t4); white-space: nowrap; padding: 0 6px; }

.notes-aside { flex: 0 0 400px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--bg); overflow: hidden; }
.notes-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.notes-scroll { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 22px; }
.nt-title { font: 500 24px/1.15 var(--f-display); letter-spacing: -.03em; }
.nt-block { display: flex; flex-direction: column; gap: 8px; }
.nt-label { font: 500 10.5px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--acc); }
.nt-text { font: 400 15px/1.6 var(--f-body); color: var(--t2); text-wrap: pretty; }
.nt-next { padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.nt-next .fit { aspect-ratio: 16 / 9; border-radius: 10px; border: 1px solid var(--line); }
.kbd-help { font: 400 12px/1.7 var(--f-mono); color: var(--t5); }

.index-ov { position: absolute; inset: 0; z-index: 8; display: flex; justify-content: center; align-items: flex-start; padding: 6vh 4vw; background: rgba(10,9,8,.86); overflow-y: auto; animation: m-up .4s var(--ease) both; }
.index-panel { width: min(980px, 100%); display: flex; flex-direction: column; gap: 28px; }
.index-top { display: flex; align-items: center; justify-content: space-between; }
.index-sec { display: flex; flex-direction: column; gap: 6px; }
.index-sec h3 { font: 500 11px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t4); margin-bottom: 6px; }
.index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.index-item { display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
.index-item .fit { aspect-ratio: 16 / 9; border-radius: 10px; border: 1px solid var(--line); transition: border-color .3s; }
.index-item:hover .fit, .index-item:focus-visible .fit { border-color: var(--conn); outline: none; }
.index-item.cur .fit { border-color: var(--acc); }
.index-item span { font: 400 13px/1.35 var(--f-body); color: var(--t2); }
.index-item span b { font: 500 11px/1 var(--f-mono); color: var(--acc); margin-right: 8px; letter-spacing: .1em; }

/* ======================================================================
   CONFIGURATOR
   ====================================================================== */
.cfg { min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.cfg-head { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px clamp(16px, 3vw, 40px); border-bottom: 1px solid var(--line); background: rgba(16,15,14,.86); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
.cfg-brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.cfg-brand img { height: 22px; width: auto; }
.cfg-brand .bar { width: 1px; height: 22px; background: var(--line-2); }
.cfg-brand span { font: 500 11px/1.3 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t2); }
.cfg-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cfg-count { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t4); margin-right: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 44px; padding: 0 18px; border: 1px solid var(--line-2); border-radius: 8px; background: transparent; font: 500 11.5px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t1); cursor: pointer; white-space: nowrap; transition: background .4s var(--ease), border-color .4s var(--ease); }
.btn:hover { background: rgba(251,250,249,.05); border-color: var(--conn); }
.btn:focus-visible { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(195,181,160,.2); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 10.5px; }
.btn.ghost { border-color: transparent; color: var(--t3); }
.btn.ghost:hover { color: var(--t1); }
.btn.danger:hover { border-color: #6b3a32; color: #e8b5aa; }
.btn-cta { display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 20px; border: 1px solid var(--acc); border-radius: 8px; background: transparent; cursor: pointer; transition: background .5s var(--ease); }
.btn-cta:hover:not(:disabled) { background: rgba(195,181,160,.12); }
.btn-cta:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(195,181,160,.25); }
.btn-cta:disabled { opacity: .35; cursor: not-allowed; }
.roll { display: block; height: 16px; overflow: hidden; font: 500 12px/16px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t1); }
.roll > span { display: block; transition: transform .55s var(--ease); }
.roll > span > span { display: block; height: 16px; }
.btn-cta:hover:not(:disabled) .roll > span { transform: translateY(-16px); }
.btn-cta .arr { font: 500 14px/1 var(--f-mono); color: var(--t1); }

.cfg-main { flex: 1; display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: clamp(24px, 3vw, 48px); padding: clamp(20px, 3vw, 40px); max-width: 1680px; width: 100%; margin: 0 auto; }
@media (max-width: 1100px) { .cfg-main { grid-template-columns: minmax(0, 1fr); } .cfg-preview { position: static !important; } }
.cfg-intro { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.cfg-intro h1 { font: 500 clamp(30px, 3vw, 42px)/1.02 var(--f-display); letter-spacing: -.046em; text-wrap: balance; }
.cfg-intro p { font: 400 15px/1.6 var(--f-body); color: var(--t3); max-width: 52ch; }
.cfg-form { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.block { display: flex; flex-direction: column; gap: 18px; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg-2); }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.block-h h2 { display: flex; align-items: baseline; gap: 12px; font: 500 22px/1.1 var(--f-display); letter-spacing: -.03em; }
.block-h h2 em { font: 500 11px/1 var(--f-mono); font-style: normal; letter-spacing: .16em; color: var(--acc); }
.block-h small { font: 400 13px/1.4 var(--f-body); color: var(--t4); }

.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .lbl { font: 500 10.5px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t4); }
.field label i { font-style: normal; color: var(--t5); letter-spacing: .08em; text-transform: none; font-family: var(--f-body); font-size: 12px; margin-left: 6px; }
.input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: 400 15px/1 var(--f-body); color: var(--t1); color-scheme: dark; transition: border-color .3s, box-shadow .3s; }
.input::placeholder { color: var(--t5); }
.input:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(195,181,160,.14); }
.input.lg { height: 56px; font: 500 20px/1 var(--f-display); letter-spacing: -.02em; }
.article { display: flex; flex-wrap: wrap; gap: 8px; }
.article button { flex: 0 0 auto; height: 40px; padding: 0 16px; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font: 400 14px/1 var(--f-body); color: var(--t3); cursor: pointer; transition: border-color .3s var(--ease), color .3s, background .3s; }
.article button:hover { border-color: var(--conn); color: var(--t1); }
.article button.on { border-color: var(--acc); background: var(--card-2); color: var(--t1); }
.article button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(195,181,160,.25); }
.logo-drop { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 12px 10px 14px; border: 1px dashed var(--line-2); border-radius: 10px; }
.logo-drop .plate { display: flex; align-items: center; justify-content: center; width: 96px; height: 44px; border-radius: 8px; background: var(--nude); }
.logo-drop .plate img { max-width: 80px; max-height: 32px; object-fit: contain; }
.logo-drop p { flex: 1; font: 400 13px/1.45 var(--f-body); color: var(--t4); }
.hint { font: 400 12.5px/1.5 var(--f-body); color: var(--t5); }
.err { font: 400 13px/1.5 var(--f-body); color: #e8b5aa; }

.mods { display: flex; flex-direction: column; gap: 10px; }
.mod { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 12px 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); transition: border-color .3s var(--ease), background .3s var(--ease); }
.mod.on { border-color: var(--acc); background: var(--card-2); }
.mod-check { display: flex; align-items: center; gap: 14px; padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left; grid-column: 1 / 3; }
.mod-check:focus-visible { outline: none; }
.mod-check:focus-visible .box { box-shadow: 0 0 0 3px rgba(195,181,160,.3); }
.box { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--line-2); border-radius: 6px; font: 600 13px/1 var(--f-mono); color: var(--bg); }
.mod.on .box { background: var(--acc); border-color: var(--acc); }
.mod-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mod-name { font: 500 19px/1.1 var(--f-display); letter-spacing: -.02em; }
.mod-desc { font: 400 13.5px/1.45 var(--f-body); color: var(--t3); }
.mod-order { display: flex; align-items: center; gap: 2px; }
.mod-pos { font: 500 11px/1 var(--f-mono); color: var(--acc); min-width: 26px; text-align: center; letter-spacing: .1em; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--t3); cursor: pointer; font: 500 14px/1 var(--f-mono); }
.icon-btn:hover:not(:disabled) { background: rgba(251,250,249,.06); color: var(--t1); }
.icon-btn:focus-visible { outline: none; border-color: var(--acc); }
.icon-btn:disabled { opacity: .25; cursor: default; }

.depth { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.depth.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .depth.three { grid-template-columns: 1fr; } }
.depth button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); cursor: pointer; text-align: left; transition: border-color .3s var(--ease), background .3s var(--ease); }
.depth button:hover { border-color: var(--conn); }
.depth button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(195,181,160,.25); }
.depth button.on { border-color: var(--acc); background: var(--card-2); }
.depth b { font: 500 18px/1.1 var(--f-display); letter-spacing: -.02em; color: var(--t1); }
.depth span { font: 400 13px/1.45 var(--f-body); color: var(--t3); }
.depth em { font: 500 10.5px/1 var(--f-mono); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }

.share-row { display: flex; flex-wrap: wrap; gap: 8px; }
.presets { display: flex; flex-direction: column; gap: 6px; }
.preset { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border: 1px solid var(--line); border-radius: 10px; }
.preset-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.preset-name b { font: 500 14px/1.2 var(--f-display); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset-name span { font: 400 11px/1 var(--f-mono); color: var(--t5); letter-spacing: .06em; }
.inline { display: flex; gap: 8px; }
.inline .input { height: 44px; }

.cfg-preview { position: sticky; top: 92px; align-self: start; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pv-stage { aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg); }
.pv-stage .fit { width: 100%; height: 100%; }
.pv-empty { display: flex; align-items: center; justify-content: center; height: 100%; padding: 24px; text-align: center; font: 400 15px/1.6 var(--f-body); color: var(--t4); }
.pv-meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pv-meta-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pv-meta-l .lbl { color: var(--acc); }
.pv-meta-l b { font: 500 20px/1.15 var(--f-display); letter-spacing: -.02em; }
.pv-meta-l p { font: 400 13.5px/1.55 var(--f-body); color: var(--t3); max-width: 64ch; }
.roteiro { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-2); overflow: hidden; }
.rt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.rt-list { display: flex; flex-direction: column; max-height: 46vh; overflow-y: auto; }
.rt-sec { padding: 14px 16px 6px; font: 500 10px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--t5); }
.rt-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 0 12px 0 16px; min-height: 44px; border-top: 1px solid #1c1b1a; cursor: pointer; }
.rt-item:hover { background: rgba(251,250,249,.03); }
.rt-item.sel { background: rgba(195,181,160,.07); }
.rt-item.off { opacity: .45; }
.rt-n { font: 500 11px/1 var(--f-mono); color: var(--acc); letter-spacing: .08em; }
.rt-t { font: 400 14px/1.3 var(--f-body); color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rt-fixed { font: 500 9.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t5); }
.switch { position: relative; width: 36px; height: 20px; flex: 0 0 auto; padding: 0; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); cursor: pointer; transition: background .3s, border-color .3s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 999px; background: var(--t4); transition: transform .3s var(--ease), background .3s; }
.switch.on { background: rgba(195,181,160,.2); border-color: var(--acc); }
.switch.on::after { transform: translateX(16px); background: var(--acc); }
.switch:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(195,181,160,.3); }

.editor { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-2); overflow: hidden; }
.editor-tabs { display: flex; border-bottom: 1px solid var(--line); }
.editor-tabs button { flex: 1; height: 44px; padding: 0 14px; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; background: transparent; font: 500 10.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t4); cursor: pointer; }
.editor-tabs button:hover { color: var(--t2); }
.editor-tabs button.on { color: var(--t1); border-bottom-color: var(--acc); }
.editor-tabs button:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(195,181,160,.35); }
.editor-body { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.field-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.input.ta { height: auto; min-height: 48px; padding: 12px 14px; line-height: 1.5; resize: vertical; font-family: var(--f-body); }
.input.ta.edited { border-color: var(--conn); }
.link-btn { padding: 0; border: 0; background: transparent; font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--acc); cursor: pointer; }
.link-btn:hover { color: var(--t1); }
.save-step { display: flex; flex-direction: column; gap: 10px; }
.save-step + .save-step { padding-top: 16px; border-top: 1px solid var(--line); }
.more { border-top: 1px solid var(--line); padding-top: 14px; }
.more summary { cursor: pointer; font: 500 10.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t4); list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more summary::before { content: '+ '; color: var(--acc); }
.more[open] summary::before { content: '− '; }
.more summary:hover { color: var(--t2); }
.more-body { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; }
.team-box { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.rt-edited { display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 999px; background: var(--acc); vertical-align: middle; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; padding: 12px 18px; border: 1px solid var(--conn); border-radius: 10px; background: var(--card-2); font: 500 11.5px/1.4 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--t1); animation: m-up .4s var(--ease) both; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border: 1px solid var(--conn); border-radius: 12px; background: var(--card-2); font: 400 13.5px/1.5 var(--f-body); color: var(--t2); }

/* ---------- notes window ---------- */
.nw { min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.nw-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.nw-timer { font: 500 22px/1 var(--f-mono); color: var(--t1); letter-spacing: .04em; }
.nw-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; padding: 20px; }
@media (max-width: 760px) { .nw-main { grid-template-columns: 1fr; } }
.nw-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.nw-col .fit { aspect-ratio: 16 / 9; border-radius: 12px; border: 1px solid var(--line); }
.nw-col .fit.next { opacity: .8; }

@media (prefers-reduced-motion: reduce) {
  .rv, .rv.on, .situation, .area, .phone-state, .dots span, .feed-done, .cta, .synth-svg path { transition: none !important; }
  .enter-up, .enter-down, .kb, .slide.enter.fwd, .slide.enter.back, .slide.leave, .area.pulse, .index-ov, .toast { animation: none !important; }
  .conn i { display: none; }
  .live-dot, .caret { animation: none; }
}

</style>
</head>
