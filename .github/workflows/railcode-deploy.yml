# Generated by `railcode ci github`.
# Deploys this app to Railcode on every push to main.
# Uses deploy --force because this branch is the deployment authority; a
# committed .railcode marker must not pin CI to an old deploy number.
#
# RAILCODE_API_TOKEN is a deploy token: it can deploy this one app and nothing
# else. Rotate or revoke it with `railcode token list|revoke`, or from the app's
# CI tab in the dashboard.
name: Deploy to Railcode
on:
  push:
    branches: ["main"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes railcode@latest deploy --force
        env:
          RAILCODE_API_URL: https://api.railcode.app
          RAILCODE_ORG_UUID: bef941ff-5201-4863-a09a-cfad685d379d
          RAILCODE_API_TOKEN: ${{ secrets.RAILCODE_API_TOKEN }}
